<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arquivo da Velha Era — registros de um universo de fantasia." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238A6A3E'/%3E%3Ctext x='16' y='22' font-family='serif' font-size='17' text-anchor='middle' fill='%23EEE5D0'%3EV%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=IM+Fell+English:ital@0;1&display=swap"
    />
    <title>Arquivo da Velha Era</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint, evitando o "piscar" de claro para escuro.
      try {
        var t = JSON.parse(localStorage.getItem('velha-era:tema'))
        if (t === 'vela' || t === 'papel') document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
